[package]
name = "cli-core"
version = "0.1.0"
edition = "2021"

[features]
activity = ["claude", "worktrees"]
ansi = ["dep:ratatui"]
claude = ["dep:dirs", "dep:serde", "dep:serde_json"]
markdown = ["dep:ratatui", "dep:syntect", "dep:unicode-width"]
nvim = ["dep:serde", "dep:serde_json"]
output = ["dep:serde", "dep:serde_json"]
sqlite = ["dep:dirs", "dep:rusqlite"]
worktrees = []

[dependencies]
dirs = { version = "6", optional = true }
ratatui = { version = "0.29", optional = true }
rusqlite = { version = "0.33", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
syntect = { version = "5", default-features = false, features = ["default-fancy"], optional = true }
unicode-width = { version = "0.2", optional = true }

[[example]]
name = "activity"
required-features = ["activity"]
